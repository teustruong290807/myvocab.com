<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vocab Master</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
</head>
<body>
    <div id="app">
        <div id="login-screen" class="screen">
            <h2>Đăng Nhập Hệ Thống</h2>
            <input type="email" id="email" placeholder="Email của bạn...">
            <input type="password" id="password" placeholder="Mật khẩu (từ 6 ký tự)...">
            <button onclick="handleAuth('login')">Đăng Nhập</button>
            <button onclick="handleAuth('register')">Tạo Tài Khoản Mới</button>
        </div>

        <div id="main-screen" class="screen hidden">
            <h2>Xin chào, <span id="user-email"></span>!</h2>
            <p>Dữ liệu của bạn đã được kết nối với đám mây.</p>
            <button onclick="firebase.auth().signOut()">Đăng Xuất</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
